[project]
name = "ispu-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# folder migrasi lokal bernama alembic/ membuat ruff salah mengira paketnya first-party
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
