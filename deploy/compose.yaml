name: ispu

# CSV asli di root repo dipasang read-only; aplikasi tidak pernah menulis ke file ini.
x-seed-clean: &seed-clean
  type: bind
  source: ../Dataset_ISPU_DKI_Jakarta_2024_2025_Clean.csv
  target: /seed/clean.csv
  read_only: true
x-seed-orange: &seed-orange
  type: bind
  source: ../Hasil_Testing_80_20_ISPU_DKI_Jakarta.csv
  target: /seed/orange_test.csv
  read_only: true
x-seed-raw: &seed-raw
  type: bind
  source: "../Filedata Data Indeks Standar Pencemar Udara ISPU di Provinsi DKI Jakarta.csv"
  target: /seed/raw.csv
  read_only: true

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ispu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ispu}
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ispu}
      POSTGRES_USER: ${POSTGRES_USER:-ispu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # Di VPS ini build lewat deploy/build.sh (--network host): bridge BuildKit ~60 KB/s ke PyPI.
    image: ispu-backend:latest
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - *seed-clean
      - *seed-orange
      - *seed-raw
      - artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    image: ispu-backend:latest
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "worker", "--concurrency", "1", "--loglevel", "INFO"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    volumes:
      - artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 20s
      start_period: 30s
      retries: 3

  beat:
    image: ispu-backend:latest
    restart: unless-stopped
    command: ["celery", "-A", "app.worker", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      # beat hanya butuh broker; pastikan Redis terjangkau dari container ini
      test: ["CMD", "python", "-c", "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../frontend
    image: ispu-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Hanya localhost: akses publik lewat cloudflared (VPS di balik NAT).
      - "127.0.0.1:${HTTP_PORT:-8300}:8300"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8300/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  artifacts:
  caddy_data:
